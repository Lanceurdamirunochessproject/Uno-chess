
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO.CHESS</title>
<style>
body {
  margin: 0;
  padding: 20px 10px;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #facc15; }
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: min(92vw, 480px);
  margin: 20px auto;
  border: 4px solid #facc15;
}
.square {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  font-size: clamp(23px, 8vw, 48px);
  cursor: pointer;
  user-select: none;
}
.light { background: #eee; color: #111; }
.dark { background: #64748b; color: #111; }
.selected { background: #facc15 !important; }
.possible { box-shadow: inset 0 0 0 5px #22c55e; }
button {
  background: #facc15;
  border: 0;
  border-radius: 10px;
  padding: 12px 20px;
  font-weight: bold;
  font-size: 16px;
}
#status { color: #93c5fd; }
.cards { font-size: 35px; margin: 20px; }
</style>
</head>
<body>

<h1>UNO.CHESS</h1>
<p>Échecs + UNO : un seul jeu !</p>

<p id="status">Tour des blancs</p>
<div id="board"></div>
<button onclick="resetGame()">Nouvelle partie</button>
<div class="cards">🟥 🟦 🟩 🟨</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const game = new Chess();
const board = document.getElementById("board");
const status = document.getElementById("status");

const symbols = {
  wk:"♔", wq:"♕", wr:"♖", wb:"♗", wn:"♘", wp:"♙",
  bk:"♚", bq:"♛", br:"♜", bb:"♝", bn:"♞", bp:"♟"
};

let selected = null;
let possible = [];

function drawBoard() {
  board.innerHTML = "";
  const position = game.board();

  position.forEach((row, r) => {
    row.forEach((piece, c) => {
      const square = document.createElement("div");
      const file = "abcdefgh"[c];
      const rank = 8 - r;
      const name = file + rank;

      square.className = "square " +
        ((r + c) % 2 === 0 ? "light" : "dark");

      if (selected === name) square.classList.add("selected");
      if (possible.includes(name)) square.classList.add("possible");

      if (piece) {
        square.textContent =
          symbols[piece.color + piece.type];
      }

      square.onclick = () => playSquare(name);
      board.appendChild(square);
    });
  });

  if (game.in_checkmate()) {
    status.textContent = "Échec et mat ! Partie terminée.";
  } else if (game.in_draw()) {
    status.textContent = "Match nul !";
  } else {
    status.textContent =
      "Tour des " + (game.turn() === "w" ? "blancs" : "noirs");
    if (game.in_check()) status.textContent += " — Échec !";
  }
}

function playSquare(name) {
  if (selected && possible.includes(name)) {
    const move = game.move({
      from: selected,
      to: name,
      promotion: "q"
    });

    if (move) {
      selected = null;
      possible = [];
      drawBoard();
      return;
    }
  }

  const moves = game.moves({
    square: name,
    verbose: true
  });

  if (moves.length) {
    selected = name;
    possible = moves.map(move => move.to);
  } else {
    selected = null;
    possible = [];
  }

  drawBoard();
}

function resetGame() {
  game.reset();
  selected = null;
  possible = [];
  drawBoard();
}

drawBoard();
</script>
</body>
</html>
